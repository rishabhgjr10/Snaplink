# Development profile using in‑memory H2 and fallback cache

# H2 in‑memory database (MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# No external Redis – let the fallback cache be used
spring.redis.host=
spring.redis.port=0

# Base URL for generated short links (frontend reads via Vite env)
BASE_URL=http://localhost:8080
