# Development profile: in-memory H2 database and in-memory caches/rate limits.
spring.datasource.url=jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# The Flyway scripts are MySQL-specific; H2 gets its schema from the entities instead.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# No Redis locally
spring.data.redis.host=

app.base-url=http://localhost:8080
app.self-hosts=localhost
app.rate-limit.trusted-proxy-hops=0
sentry.environment=development
