# ==============================================================================
# SnapLink URL Shortener - Application Configuration
# ==============================================================================

# Application & Public Domain
spring.application.name=snaplink
app.base-url=${APP_BASE_URL:${BASE_URL:http://localhost:8080}}
BASE_URL=${app.base-url}

# Server Configuration
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ------------------------------------------------------------------------------
# Datasource Configuration (MySQL / Aiven / Local)
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:url_shortener}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:rootpassword}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------------------
# Redis Cache Configuration (Local / Aiven with SSL)
# ------------------------------------------------------------------------------
spring.data.redis.host=${SPRING_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_REDIS_PORT:${REDIS_PORT:6379}}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_REDIS_SSL:false}

# Backward compatibility bindings
spring.redis.host=${spring.data.redis.host}
spring.redis.port=${spring.data.redis.port}
spring.redis.password=${spring.data.redis.password}

# ------------------------------------------------------------------------------
# Global CORS Configuration
# ------------------------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://*.vercel.app}

# Profiles
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
