# ==============================================================================
# SnapLink URL Shortener - Application Configuration
# ==============================================================================

# Application & Public Domain
spring.application.name=snaplink
app.base-url=${APP_BASE_URL:${BASE_URL:http://localhost:8080}}
BASE_URL=${app.base-url}

# Server Configuration
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ------------------------------------------------------------------------------
# Datasource Configuration (Aiven Managed MySQL with SSL)
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://snaplink-snapliink.c.aivencloud.com:16093/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------------------
# Redis Cache Configuration (Aiven Redis with SSL / Local fallback)
# ------------------------------------------------------------------------------
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_REDIS_SSL:true}

# Backward compatibility bindings
spring.redis.host=${spring.data.redis.host}
spring.redis.port=${spring.data.redis.port}
spring.redis.password=${spring.data.redis.password}
spring.redis.ssl=${spring.data.redis.ssl.enabled}

# ------------------------------------------------------------------------------
# Global CORS Configuration
# ------------------------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://bauna.vercel.app,https://snaplink-tau.vercel.app,https://*.vercel.app}

# Profiles
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
