# ==============================================================================
# SnapLink URL Shortener - Application Configuration
# Secrets and infrastructure addresses come from environment variables only.
# ==============================================================================
spring.application.name=snaplink
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Server
server.port=${PORT:8080}
# Proxy headers are interpreted by ClientIpResolver (app.rate-limit.trusted-proxy-hops), not by Spring.
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never

# ------------------------------------------------------------------------------
# Application
# ------------------------------------------------------------------------------
# Public origin that short links are served from (used to reject self-referencing destinations).
app.base-url=${APP_BASE_URL:${BASE_URL:http://localhost:8080}}
# Extra hosts that must never be used as destinations (comma separated).
app.self-hosts=${APP_SELF_HOSTS:bauna.xyz,www.bauna.xyz}
# Destination domains rejected on create/update (comma separated, subdomains included).
app.blocked-domains=${APP_BLOCKED_DOMAINS:}
# Firebase UIDs allowed to use /api/v1/admin/** (comma separated).
app.admin-uids=${APP_ADMIN_UIDS:}
# Firebase project whose ID tokens are accepted.
app.firebase-project-id=${FIREBASE_PROJECT_ID:snapliink}
# Optional Google Safe Browsing v4 API key; destinations are not screened when empty.
app.safe-browsing-api-key=${SAFE_BROWSING_API_KEY:}

# CORS: exact origins only (the production frontend calls the API same-origin through Vercel).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://bauna.xyz,https://www.bauna.xyz}

# Rate limits (tokens per minute)
app.rate-limit.write-per-minute=${RATE_LIMIT_WRITE_PER_MINUTE:20}
app.rate-limit.read-per-minute=${RATE_LIMIT_READ_PER_MINUTE:120}
app.rate-limit.anonymous-global-per-minute=${RATE_LIMIT_ANON_GLOBAL_PER_MINUTE:200}
# Number of trusted reverse proxies that append to X-Forwarded-For in front of this app.
app.rate-limit.trusted-proxy-hops=${RATE_LIMIT_TRUSTED_PROXY_HOPS:1}

# Click analytics
app.analytics.retention-days=${ANALYTICS_RETENTION_DAYS:365}
app.analytics.dedupe-window-seconds=${ANALYTICS_DEDUPE_WINDOW_SECONDS:30}

# Short-link cache
app.cache.ttl-hours=${URL_CACHE_TTL_HOURS:24}
app.cache.local-max-entries=${URL_CACHE_LOCAL_MAX_ENTRIES:10000}

# ------------------------------------------------------------------------------
# Datasource (MySQL). No defaults: the address and credentials must be provided.
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is owned by Flyway (src/main/resources/db/migration).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ------------------------------------------------------------------------------
# Redis (optional). Leave SPRING_REDIS_HOST empty to use the in-memory fallbacks.
# ------------------------------------------------------------------------------
spring.data.redis.host=${SPRING_REDIS_HOST:}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_REDIS_SSL:true}
spring.data.redis.timeout=2s
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# ------------------------------------------------------------------------------
# Observability
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:production}
sentry.traces-sample-rate=0.0
